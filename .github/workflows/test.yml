name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify vendored dependencies
        run: make verify-vendor

      - name: Verify the tag-gated live tests still compile
        run: make verify-live-tests

      - name: Running Tests
        run: make test
