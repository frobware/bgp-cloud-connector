apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: deploy-fbc-operator-run
spec:
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/openshift/bgp-cloud-connector.git
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/its/deploy-fbc-operator.yaml
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
