---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: cudnbgpconfigs.networking.openshift.io
spec:
  group: networking.openshift.io
  names:
    kind: CUDNBgpConfig
    listKind: CUDNBgpConfigList
    plural: cudnbgpconfigs
    singular: cudnbgpconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.platform
      name: Platform
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CUDNBgpConfig is the singleton cluster-scoped BGP infrastructure
          configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              autoLabelRouterNodes:
                description: |-
                  AutoLabelRouterNodesSpec makes the operator maintain
                  spec.routerNodeSelector on the nodes that should be BGP routers, instead of
                  requiring something else to have labelled them. Without it a node added by
                  scaling a MachineSet is silently not a router, because the MachineSet
                  template carries no such label.

                  It is opt-in: leaving it unset means the operator only ever reads Node
                  objects, which is the right behaviour where the labels are already managed
                  deliberately.
                properties:
                  eligible:
                    additionalProperties:
                      type: string
                    description: Eligible selects the nodes that should be BGP routers.
                    minProperties: 1
                    type: object
                  exclude:
                    additionalProperties:
                      type: string
                    description: |-
                      Exclude removes a node from eligibility if it carries any of these
                      label keys, whatever their value. Typically infra nodes.
                    type: object
                required:
                - eligible
                type: object
              aws:
                properties:
                  region:
                    type: string
                  routeServerIDs:
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - region
                - routeServerIDs
                type: object
              azure:
                description: |-
                  AzureConfig identifies the Azure Route Server the router nodes peer with.
                  Azure models a Route Server as a Virtual Hub, and its own addresses and ASN
                  are read from it rather than configured here.
                properties:
                  resourceGroup:
                    minLength: 1
                    type: string
                  routeServerName:
                    description: |-
                      RouteServerName is the Azure Route Server whose BGP connections this
                      operator manages. Its VirtualRouterIPs become the BGP neighbours.
                    minLength: 1
                    type: string
                  subscriptionID:
                    minLength: 1
                    type: string
                required:
                - resourceGroup
                - routeServerName
                - subscriptionID
                type: object
              bgp:
                properties:
                  livenessDetection:
                    default: bgp-keepalive
                    enum:
                    - bfd
                    - bgp-keepalive
                    type: string
                  localASN:
                    format: int64
                    maximum: 4294967295
                    minimum: 0
                    type: integer
                  peerGroups:
                    items:
                      properties:
                        neighbors:
                          items:
                            properties:
                              address:
                                type: string
                              ebgpMultiHop:
                                description: |-
                                  EBGPMultiHop allows the session to be established with a peer that is
                                  not on this node's link. Azure Route Server needs it; AWS Route Server
                                  and GCP Cloud Router do not.
                                type: boolean
                              remoteASN:
                                format: int64
                                maximum: 4294967295
                                minimum: 0
                                type: integer
                            required:
                            - address
                            - remoteASN
                            type: object
                          minItems: 1
                          type: array
                        nodeSelector:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                      - neighbors
                      - nodeSelector
                      type: object
                    type: array
                required:
                - localASN
                type: object
              gcp:
                properties:
                  cloudRouterName:
                    description: |-
                      CloudRouterName is the Cloud Router the router nodes peer with. Its
                      interface addresses become the BGP neighbours.
                    minLength: 1
                    type: string
                  enableNestedVirtualization:
                    default: true
                    description: |-
                      EnableNestedVirtualization turns on nested virtualisation on the router
                      instances, which KubeVirt needs. Enabling it restarts the instance.
                    type: boolean
                  machineNamespace:
                    default: openshift-machine-api
                    description: |-
                      MachineNamespace holds the OpenShift Machine objects whose preTerminate
                      hooks gate instance deletion until BGP peers are withdrawn.
                    type: string
                  ncc:
                    description: |-
                      NCCConfig identifies the Network Connectivity Center hub the router nodes
                      attach to as spokes.
                    properties:
                      hubName:
                        minLength: 1
                        type: string
                      siteToSiteDataTransfer:
                        description: |-
                          SiteToSiteDataTransfer enables NCC site-to-site data transfer on the
                          managed spokes.
                        type: boolean
                      spokePrefix:
                        description: |-
                          SpokePrefix names the spokes this operator manages. Spokes are numbered
                          from it, because a hub spoke holds a limited number of instances.
                        minLength: 1
                        type: string
                    required:
                    - hubName
                    - spokePrefix
                    type: object
                  project:
                    minLength: 1
                    type: string
                  region:
                    minLength: 1
                    type: string
                required:
                - cloudRouterName
                - ncc
                - project
                - region
                type: object
              platform:
                description: |-
                  Platform selects which cloud the operator reconciles against and which
                  cloud-specific block below must be populated.
                enum:
                - AWS
                - Azure
                - GCP
                - Manual
                type: string
              requireReadyNodes:
                description: |-
                  RequireReadyNodes drops nodes that are not Ready from the router set,
                  so the cloud stops sending traffic to a node that cannot forward it.

                  It is off by default because turning it on churns cloud peerings
                  whenever a node reboots: the peering is removed as the node goes
                  NotReady and recreated when it returns. Whether that trade is worth
                  making depends on how long your nodes stay NotReady, which is not
                  something this operator can know.
                type: boolean
              routerNodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  RouterNodeSelector identifies the BGP router nodes. When
                  AutoLabelRouterNodes is set the operator maintains these labels;
                  otherwise something else must apply them.
                type: object
              suspended:
                description: |-
                  Suspended releases everything the operator created in the cloud and
                  stops reconciling, keeping the configuration. It is not a deletion:
                  the finalizer stays and clearing the field brings everything back,
                  where deleting the CR would mean writing it again to resume.

                  The Network operator patch is deliberately not reverted, for the same
                  reason teardown does not revert it: undoing
                  additionalRoutingCapabilities restarts OVN-Kubernetes on every node.
                type: boolean
            required:
            - bgp
            - platform
            - routerNodeSelector
            type: object
            x-kubernetes-validations:
            - message: spec.aws must be set when spec.platform is AWS, and must be
                absent otherwise
              rule: (self.platform == 'AWS') == has(self.aws)
            - message: spec.azure must be set when spec.platform is Azure, and must
                be absent otherwise
              rule: (self.platform == 'Azure') == has(self.azure)
            - message: spec.gcp must be set when spec.platform is GCP, and must be
                absent otherwise
              rule: (self.platform == 'GCP') == has(self.gcp)
            - message: spec.bgp.peerGroups is required when spec.platform is Manual
              rule: self.platform != 'Manual' || (has(self.bgp.peerGroups) && size(self.bgp.peerGroups)
                > 0)
            - message: spec.bgp.peerGroups may only be set when spec.platform is Manual
              rule: self.platform == 'Manual' || !has(self.bgp.peerGroups) || size(self.bgp.peerGroups)
                == 0
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              peerGroups:
                description: |-
                  PeerGroups is the discovered peering plan: what the operator found in
                  the cloud and rendered into FRRConfigurations. Empty under
                  platform: Manual, where the plan is declared in spec.bgp.peerGroups
                  rather than discovered.
                items:
                  description: |-
                    PeerGroupStatus reports one group of the peering plan the operator
                    discovered, and therefore what FRR was configured to peer with. Every cloud
                    populates it, which is why it replaced the AWS-shaped status.aws: that block
                    reported Route Server endpoints and had no GCP or Azure equivalent, so on
                    those clouds the operator reconciled peerings and said nothing about them.
                  properties:
                    key:
                      description: |-
                        Key names the group in cloud-meaningful terms: an availability zone on
                        AWS, the Cloud Router or Route Server name on GCP and Azure.
                      type: string
                    neighbors:
                      description: Neighbors are the addresses the router nodes in
                        this group peer with.
                      items:
                        properties:
                          address:
                            type: string
                          ebgpMultiHop:
                            description: |-
                              EBGPMultiHop allows the session to be established with a peer that is
                              not on this node's link. Azure Route Server needs it; AWS Route Server
                              and GCP Cloud Router do not.
                            type: boolean
                          remoteASN:
                            format: int64
                            maximum: 4294967295
                            minimum: 0
                            type: integer
                        required:
                        - address
                        - remoteASN
                        type: object
                      type: array
                    nodeSelector:
                      additionalProperties:
                        type: string
                      description: |-
                        NodeSelector is the selector narrowing spec.routerNodeSelector to this
                        group. Empty means every router node, which is what the single-group
                        clouds emit.
                      type: object
                  required:
                  - key
                  type: object
                type: array
              phase:
                enum:
                - Pending
                - Configuring
                - Ready
                - Degraded
                - Suspended
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
