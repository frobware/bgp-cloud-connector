apiVersion: networking.openshift.io/v1alpha1
kind: CUDNBgpConfig
metadata:
  name: cluster
spec:
  # Which cloud the operator reconciles against. AWS requires spec.aws;
  # Manual requires spec.bgp.availabilityZones and calls no cloud API.
  platform: AWS

  bgp:
    localASN: 65001                  # terraform output rosa_bgp_asn
    livenessDetection: bgp-keepalive # bfd | bgp-keepalive (default)

  routerNodeSelector:
    networking.openshift.io/cudn-bgp-router: ""

  # --- AWS auto-discovery mode (platform: AWS) ---
  # The operator discovers Route Server endpoints, neighbor IPs, and remote
  # ASN automatically. Do NOT set spec.bgp.availabilityZones in this mode.
  aws:
    region: us-east-1                # terraform output aws_region
    routeServerIDs:                  # terraform output vpc1_route_server_ids
      - rs-0abc123456789abcd

  # --- Without cloud integration (platform: Manual) ---
  # Specify neighbors explicitly and omit spec.aws.
  # platform: Manual
  # bgp:
  #   localASN: 65001
  #   availabilityZones:
  #     - nodeSelector:
  #         topology.kubernetes.io/zone: us-east-1a
  #       neighbors:
  #         - address: 10.0.1.47
  #           remoteASN: 64512
  #         - address: 10.0.1.183
  #           remoteASN: 64512
  #     - nodeSelector:
  #         topology.kubernetes.io/zone: us-east-1b
  #       neighbors:
  #         - address: 10.0.2.91
  #           remoteASN: 64512
  #         - address: 10.0.2.204
  #           remoteASN: 64512
  #     - nodeSelector:
  #         topology.kubernetes.io/zone: us-east-1c
  #       neighbors:
  #         - address: 10.0.3.62
  #           remoteASN: 64512
  #         - address: 10.0.3.178
  #           remoteASN: 64512
