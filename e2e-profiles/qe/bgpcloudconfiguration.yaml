apiVersion: networking.openshift.io/v1beta1
kind: BGPCloudConfiguration
metadata:
  name: cluster
spec:
  platform: AWS

  bgp:
    localASN: 65001
    livenessDetection: bgp-keepalive

  routerNodeSelector:
    bgp_router: "true"

  aws:
    region: us-east-2
    routeServerIDs:
      - rs-01dd2d2f9238cf294
