apiVersion: networking.openshift.io/v1alpha1
kind: CUDNBgpConfig
metadata:
  name: cluster
spec:
  platform: AWS

  bgp:
    localASN: 65001
    livenessDetection: bgp-keepalive

  routerNodeSelector:
    networking.openshift.io/cudn-bgp-router: ""

  autoLabelRouterNodes:
    eligible:
      node-role.kubernetes.io/worker: ""
    exclude:
      node-role.kubernetes.io/infra: ""

  # Good for amcdermo-2608170942-f5m2r and no other. A VPC can hold several
  # route servers and their endpoints are per subnet, so this is the one
  # cloud where discovery emits a peer group per availability zone.
  aws:
    region: us-east-2
    routeServerIDs:
      - rs-0c58b2ae20c416986
