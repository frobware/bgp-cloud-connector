apiVersion: networking.openshift.io/v1alpha1
kind: CUDNBgpConfig
metadata:
  name: cluster
spec:
  platform: AWS
  bgp:
    localASN: 65001
    livenessDetection: bgp-keepalive

  routerNodeSelector:
    networking.openshift.io/cudn-bgp-router: ""

  aws:
    region: us-east-1
    routeServerIDs:               # terraform output vpc1_route_server_ids
      - rs-0abc123456789abcd
